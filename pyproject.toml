[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fatsecret-mcp"
version = "0.1.1"
description = "Model Context Protocol server for the FatSecret platform API (OAuth 1.0a user-scoped)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Mei Park" }]
keywords = ["mcp", "fatsecret", "nutrition", "food-tracking", "claude", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "mcp>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
fatsecret-mcp = "fatsecret_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/meimakes/fatsecret-mcp"
Issues = "https://github.com/meimakes/fatsecret-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["fatsecret_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
